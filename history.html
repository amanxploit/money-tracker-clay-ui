<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Manager — History</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="page-header">
    <h1>📋 History</h1>
    <p>All your transactions in one place</p>
  </div>

  <div class="container">

    <!-- Filter Bar -->
    <div class="filter-bar">
      <input type="date" id="start-date" />
      <input type="date" id="end-date" />
      <button id="filter-btn" class="filter-btn">Filter</button>
      <button id="clear-filter-btn" class="clear-btn">Clear</button>
    </div>

    <!-- Transaction List -->
    <div id="history-list">
      <p class="empty-state">Loading…</p>
    </div>

  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="modal-overlay"></div>
  <div class="modal" id="edit-modal">
    <h2>✏️ Edit Transaction</h2>

    <input type="hidden" id="edit-id" />

    <div class="form-group">
      <label for="edit-type">Type</label>
      <select id="edit-type" class="clay-input">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    </div>

    <div class="form-group">
      <label for="edit-amount">Amount (₹)</label>
      <input type="number" id="edit-amount" class="clay-input" min="0" step="0.01" />
    </div>

    <div class="form-group">
      <label for="edit-category">Category</label>
      <select id="edit-category" class="clay-input"></select>
    </div>

    <div class="form-group">
      <label for="edit-person">Person</label>
      <input type="text" id="edit-person" class="clay-input" />
    </div>

    <div class="form-group">
      <label for="edit-notes">Notes</label>
      <input type="text" id="edit-notes" class="clay-input" />
    </div>

    <div class="form-group">
      <label for="edit-date">Date</label>
      <input type="date" id="edit-date" class="clay-input" />
    </div>

    <div class="modal-actions">
      <button class="clay-btn" onclick="UI.submitEdit()">💾 Save</button>
      <button class="clear-btn" onclick="UI.closeEditModal()">Cancel</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="navbar">
    <a href="index.html">
      <span class="nav-icon">🏠</span>
      <span>Dashboard</span>
    </a>
    <a href="add.html">
      <span class="nav-icon">➕</span>
      <span>Add</span>
    </a>
    <a href="history.html" class="active">
      <span class="nav-icon">📋</span>
      <span>History</span>
    </a>
  </nav>

  <div id="toast-container"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await UI.renderHistory();
      UI.initHistoryFilters();

      // Close modal on overlay click
      document.getElementById("modal-overlay").addEventListener("click", () => {
        UI.closeEditModal();
      });
    });
  </script>

</body>
</html>
