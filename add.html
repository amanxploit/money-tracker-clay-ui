<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Manager — Add Transaction</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="page-header">
    <h1>➕ Add Transaction</h1>
    <p>Record your income or expense</p>
  </div>

  <div class="container">

    <form id="add-form">

      <!-- Type Toggle -->
      <div class="form-group">
        <label>Type</label>
        <div class="type-toggle">
          <label class="expense-label">
            <input type="radio" name="type" value="expense" checked />
            <span>Expense</span>
          </label>
          <label class="income-label">
            <input type="radio" name="type" value="income" />
            <span>Income</span>
          </label>
        </div>
      </div>

      <!-- Quick Add -->
      <label>Quick Add</label>
      <div class="quick-add">
        <button type="button" class="quick-btn" data-amount="50">+₹50</button>
        <button type="button" class="quick-btn" data-amount="100">+₹100</button>
        <button type="button" class="quick-btn" data-amount="500">+₹500</button>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" class="clay-input" placeholder="0" min="0" step="0.01" required />
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" class="clay-input"></select>
      </div>

      <!-- Person -->
      <div class="form-group">
        <label for="person">Person (optional)</label>
        <input type="text" id="person" class="clay-input" placeholder="e.g. Rahul, Shopkeeper" />
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label for="notes">Notes (optional)</label>
        <input type="text" id="notes" class="clay-input" placeholder="Short note…" />
      </div>

      <!-- Date -->
      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" class="clay-input" />
      </div>

      <!-- Submit -->
      <button type="submit" class="clay-btn">💾 Save Transaction</button>

    </form>

  </div>

  <!-- Bottom Navigation -->
  <nav class="navbar">
    <a href="index.html">
      <span class="nav-icon">🏠</span>
      <span>Dashboard</span>
    </a>
    <a href="add.html" class="active">
      <span class="nav-icon">➕</span>
      <span>Add</span>
    </a>
    <a href="history.html">
      <span class="nav-icon">📋</span>
      <span>History</span>
    </a>
  </nav>

  <div id="toast-container"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => UI.initAddPage());
  </script>

</body>
</html>
